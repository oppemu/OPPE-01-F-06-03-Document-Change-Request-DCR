<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ใบร้องขอแก้ไขเอกสาร (Document Change Request : DCR)</title>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ใบร้องขอแก้ไขเอกสาร (DCR)</h1>
            <p>กองกายภาพและสิ่งแวดล้อม มหาวิทยาลัยมหิดล</p>
        </div>
        
        <form id="dcrForm">
            <!-- ส่วนที่ 1: ตรวจสอบสิทธิ์ผู้ใช้งาน -->
            <div class="section-title">1. ตรวจสอบสิทธิ์ผู้ใช้งาน</div>
            <div class="form-row" style="align-items: flex-end;">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label>อีเมลผู้ยื่นคำขอ (Email) <span class="required">*</span></label>
                    <input type="email" id="emailInput" name="email" placeholder="ระบุอีเมลมหิดล เช่น example@mahidol.ac.th" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <button type="button" id="verifyBtn">ตรวจสอบ</button>
                </div>
            </div>
            <p id="emailStatus" class="status-msg"></p>

            <!-- ส่วนที่ 2: ฟอร์มหลัก (ซ่อนไว้ก่อนตรวจสอบผ่าน) -->
            <div id="mainFormArea" style="display: none;">
                
                <div class="section-title">2. ข้อมูลผู้ยื่นคำขอ</div>
                <div class="form-group">
                    <label>ชื่อ-นามสกุล (ผู้ขอแก้ไข)</label>
                    <input type="text" name="reporterName" id="reporterName" readonly class="readonly-field">
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>ตำแหน่ง</label>
                        <input type="text" name="position" id="position" readonly class="readonly-field">
                    </div>
                    <div class="form-group half">
                        <label>รหัสหน่วยงาน / ส่วนงาน</label>
                        <input type="text" name="department" id="department" readonly class="readonly-field">
                    </div>
                </div>

                <div class="section-title">3. รายละเอียดการขอแก้ไขเอกสาร</div>
                
                <div class="form-group">
                    <label>ประเภทการดำเนินการ <span class="required">*</span></label>
                    <select name="operationsName" required>
                        <option value="">-- เลือกประเภทการดำเนินการ --</option>
                        <option value="ขึ้นทะเบียนใหม่">ขึ้นทะเบียนใหม่</option>
                        <option value="ขอแก้ไขเอกสาร">ขอแก้ไขเอกสาร</option>
                        <option value="ขอยกเลิกเอกสาร">ขอยกเลิกเอกสาร</option>
                        <option value="ขอทบทวนเอกสาร">ขอทบทวนเอกสาร</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ลำดับหมวด / ชื่อหมวดงาน (คอลัมน์ H) <span class="required">*</span></label>
                    <select name="docID" id="docID" required>
                        <option value="">-- กำลังโหลดรายการหมวดงาน... --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ชื่อระเบียบปฏิบัติ (DocCategory - คอลัมน์ I) <span class="required">*</span></label>
                    <select name="docCategory" id="docCategory" required disabled>
                        <option value="">-- กรุณาเลือกหมวดงานก่อน --</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label>ประเภทเอกสาร (DocCode)</label>
                        <select name="docCode">
                            <option value="">-- เลือกประเภท --</option>
                            <option value="P">P - ระเบียบปฏิบัติ (Procedure)</option>
                            <option value="F">F - แบบฟอร์ม (Form)</option>
                            <option value="M">M - คู่มือคุณภาพ (Manual)</option>
                            <option value="W">W - คำแนะนำการทำงาน (Work Instruction)</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label>รหัสเอกสาร (DocCode2)</label>
                        <input type="text" name="docCode2" placeholder="ต.ย. OPPE-13-F-04-01">
                    </div>
                </div>

                <div class="form-group">
                    <label>ชื่อเอกสาร <span class="required">*</span></label>
                    <input type="text" name="docName" required placeholder="ระบุชื่อเอกสารที่ต้องการแก้ไข/จัดทำ">
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label>ครั้งที่แก้ไขเดิม (Current Rev.)</label>
                        <input type="text" name="docItem" placeholder="ต.ย. 00">
                    </div>
                    <div class="form-group half">
                        <label>แก้ไขครั้งที่ (New Rev.)</label>
                        <input type="text" name="docItem2" placeholder="ต.ย. 01">
                    </div>
                </div>

                <div class="form-group">
                    <label>รายละเอียดที่แก้ไข / เหตุผลการร้องขอ <span class="required">*</span></label>
                    <textarea name="docIDetail" rows="4" required placeholder="ระบุรายละเอียดสิ่งที่ต้องการแก้ไข หรือเหตุผลในการร้องขอ..."></textarea>
                </div>

                <div class="section-title">4. เอกสารแนบประกอบ (ถ้ามี)</div>
                <p class="upload-note">* รองรับไฟล์ PDF, Word หรือ รูปภาพ (ขนาดไม่เกิน 5MB)</p>
                <div class="form-group">
                    <label>ไฟล์ร่างเอกสาร/ไฟล์แนบเพิ่มเติม</label>
                    <input type="file" id="attachFile" accept=".pdf,.doc,.docx,.jpg,.png">
                </div>

                <button type="submit" id="submitBtn">🚀 ส่งใบร้องขอแก้ไขเอกสาร (DCR)</button>
            </div>
        </form>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
